name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests-linux:
    name: Core unit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: App manifest is plain ASCII (Swift Playground compatibility)
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' Jarvis.swiftpm/Package.swift; then
            echo "::error file=Jarvis.swiftpm/Package.swift::Non-ASCII characters make Swift Playground fail to load the package (CouldNotFindNullRecordSeparator)"
            exit 1
          fi
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev > /dev/null
      - name: swift test
        run: swift test --parallel

  playground-like-build:
    name: Device build with Xcode ${{ matrix.xcode }} (Swift Playground-like SDK)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        # Swift Playground 4.7 (March 2026) bundles an iOS 26 SDK of that era; Xcode 26.0 cannot
        # build here (no matching simulator runtime for actool), so test the 26.2 and 26.4 SDKs.
        xcode: ["26.2", "26.3", "26.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version
          swift --version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Build for a real device (generic/platform=iOS), as Swift Playground does on iPad
        working-directory: Jarvis.swiftpm
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Jarvis \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -continue-building-after-errors -Xfrontend -warn-long-expression-type-checking=100 -Xfrontend -warn-long-function-bodies=200' \
            build 2>&1 | tee device-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | sort -u | head -200 || true
          grep -q "BUILD SUCCEEDED" device-build.log
      - name: Slowest expressions to type-check (risk on older compilers)
        if: always()
        working-directory: Jarvis.swiftpm
        run: |
          grep -E "took [0-9]+ms to type-check" device-build.log | sed -E 's/^.*Sources\///' | sort -u \
            | awk -F'took ' '{ split($2, a, "ms"); print a[1] "ms  " $0 }' | sort -rn | head -40 || true
      - name: Expansion of @Generable (reference for macro-free code)
        if: always() && matrix.xcode == '26.2'
        run: |
          mkdir -p "$RUNNER_TEMP/gen" && cd "$RUNNER_TEMP/gen"
          cat > demo.swift <<'SWIFT'
          import FoundationModels
          @Generable
          struct Demo {
              @Guide(description: "reply text")
              var reply: String
              @Guide(description: "options", .maximumCount(3))
              var options: [String]
              @Guide(description: "minutes")
              var minutes: Int
              @Guide(description: "x")
              var x: Double
          }
          @Generable
          struct Outer {
              @Guide(description: "parts", .maximumCount(24))
              var parts: [Demo]
          }
          SWIFT
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios26.0 -typecheck -Xfrontend -dump-macro-expansions demo.swift 2>&1 | head -250 || true
      - name: Device build warnings
        if: always()
        working-directory: Jarvis.swiftpm
        run: |
          echo "warnings: $(grep -c 'warning:' device-build.log || true)"
          grep -E 'warning:|error:' device-build.log | sed -E 's/^.*Sources\///' | sort -u | head -80 || true
      - name: Upload device build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-xcode-${{ matrix.xcode }}
          path: Jarvis.swiftpm/device-build.log

  ios-app-build:
    name: Build Jarvis.swiftpm for iOS Simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Core unit tests (macOS)
        run: swift test --parallel
      - name: List schemes
        working-directory: Jarvis.swiftpm
        run: xcodebuild -list
      - name: Build app (no signing)
        working-directory: Jarvis.swiftpm
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Jarvis \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -continue-building-after-errors' \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | sort -u | head -150 || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Warning summary
        if: always()
        working-directory: Jarvis.swiftpm
        run: |
          echo "warnings: $(grep -c 'warning:' build.log || true)"
          grep 'warning:' build.log | sed -E 's/^.*Sources\///' | sort -u | head -60 || true
      - name: Launch in iPad simulator (smoke test)
        working-directory: Jarvis.swiftpm
        timeout-minutes: 40
        run: |
          set -x
          # Time limit for any single simulator command, so a hang shows up as a failure with logs.
          t() { local secs=$1; shift; perl -e 'alarm shift @ARGV; exec @ARGV' "$secs" "$@"; }
          phase() { echo "==== $1 ($(date +%T))"; }
          xcodebuild -scheme Jarvis -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            -skipMacroValidation -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build > sim-build.log 2>&1 || (tail -50 sim-build.log; exit 1)
          APP=$(find dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          echo "app: $APP"
          DEVICE=$(xcrun simctl list devices available | grep -E "iPad Pro|iPad Air" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device: $DEVICE"
          t 300 xcrun simctl boot "$DEVICE"
          t 600 xcrun simctl bootstatus "$DEVICE" -b
          t 300 xcrun simctl install "$DEVICE" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "bundle: $BUNDLE"
          # Capabilities (purpose strings) and Info-Extra.plist must both reach the app's Info.plist.
          for KEY in UIBackgroundModes CFBundleURLTypes:0:CFBundleURLSchemes NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription NSCameraUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$KEY" "$APP/Info.plist" || { echo "MISSING $KEY IN INFO.PLIST"; exit 1; }
          done
          t 60 xcrun simctl privacy "$DEVICE" grant microphone "$BUNDLE" || true
          t 60 xcrun simctl privacy "$DEVICE" grant camera "$BUNDLE" || true
          t 60 xcrun simctl privacy "$DEVICE" grant photos "$BUNDLE" || true
          phase "1 onboarding"
          # 1) First launch exactly as a user sees it (onboarding).
          t 120 xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 20
          t 60 xcrun simctl io "$DEVICE" screenshot ../screenshot-launch.png
          t 60 xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
          phase "2 scripted 3D commands"
          # 2) End-to-end commands (grammar → brain → executor → RealityKit), fed by a launch-argument
          #    script because `simctl openurl` shows an "Open in Jarvis?" confirmation that CI cannot tap.
          xcrun simctl spawn "$DEVICE" log stream --level info --style compact \
            --predicate 'subsystem == "com.jarvis.local.assistant"' > ../app-log.txt 2>&1 &
          LOGPID=$!
          t 120 xcrun simctl launch "$DEVICE" "$BUNDLE" -JarvisSkipOnboarding YES -JarvisNoMic YES \
            -JarvisScript "open the 3D space || make three red cubes || clone it twice || 파란 구 만들어줘"
          sleep 60
          t 60 xcrun simctl io "$DEVICE" screenshot ../screenshot-3d.png
          kill $LOGPID || true
          echo "---- app log (agent) ----"; grep -E "Script command|agent|space3d" ../app-log.txt | tail -60 || true
          if t 60 xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE"; then echo "APP STILL RUNNING ✅"; else echo "APP NOT RUNNING ❌"; fi
          t 60 xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
          phase "2b confirmation, music, apps"
          # 2b) Yes/no confirmation, the requested song, and opening an app (web fallback when
          #     the app is not installed, as in the simulator).
          xcrun simctl spawn "$DEVICE" log stream --level info --style compact \
            --predicate 'subsystem == "com.jarvis.local.assistant"' > ../app-log-music.txt 2>&1 &
          LOGPID=$!
          t 120 xcrun simctl launch "$DEVICE" "$BUNDLE" -JarvisSkipOnboarding YES -JarvisNoMic YES \
            -JarvisScript "make a red cube || clear the scene || yes || play bohemian rhapsody || open youtube"
          sleep 90
          t 60 xcrun simctl io "$DEVICE" screenshot ../screenshot-music.png
          kill $LOGPID || true
          echo "---- app log (music / apps / confirmation) ----"; grep -E "Script command|Turn|Confirm|Music|Open " ../app-log-music.txt | tail -40 || true
          if grep -q "Confirmed clearScene: success=true objects=0" ../app-log-music.txt; then echo "CONFIRMATION YES ✅"; else echo "CONFIRMATION NOT APPLIED ❌"; exit 1; fi
          if grep -iqE "Music: .* -> .*bohemian" ../app-log-music.txt; then echo "REQUESTED SONG ✅"; else echo "REQUESTED SONG NOT CONFIRMED ⚠️ (YouTube may be unreachable from CI)"; fi
          if grep -qE "Open youtube: via" ../app-log-music.txt; then echo "APP OPEN ATTEMPTED ✅"; else echo "APP OPEN NOT ATTEMPTED ❌"; exit 1; fi
          t 60 xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
          phase "3 Begin button"
          # 3) The onboarding "Begin" button: wake with spoken reply and microphone capture,
          #    forcing the direct-synthesizer fallback that used to crash on devices.
          xcrun simctl spawn "$DEVICE" log stream --level info --style compact \
            --predicate 'subsystem == "com.jarvis.local.assistant"' > ../app-log-begin.txt 2>&1 &
          LOGPID=$!
          t 120 xcrun simctl launch "$DEVICE" "$BUNDLE" -JarvisPressBegin YES -JarvisForceDirectSpeech YES
          sleep 30
          t 60 xcrun simctl io "$DEVICE" screenshot ../screenshot-begin.png
          kill $LOGPID || true
          echo "---- app log (begin) ----"; grep -E "Speaking|voice|Script|Turn" ../app-log-begin.txt | tail -30 || true
          if t 60 xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE"; then echo "APP ALIVE AFTER BEGIN ✅"; else echo "APP DIED AFTER BEGIN ❌"; exit 1; fi
          if grep -q "Speaking ended" ../app-log-begin.txt; then echo "RETURNED TO LISTENING ✅"; else echo "STUCK SPEAKING ❌"; exit 1; fi
          t 60 xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
          phase "4 emergency button"
          # 4) The emergency wake button, pressed while asleep and again while awake: it must
          #    answer both times and (re)start listening.
          xcrun simctl spawn "$DEVICE" log stream --level info --style compact \
            --predicate 'subsystem == "com.jarvis.local.assistant"' > ../app-log-emergency.txt 2>&1 &
          LOGPID=$!
          t 120 xcrun simctl launch "$DEVICE" "$BUNDLE" -JarvisSkipOnboarding YES -JarvisPressEmergency YES
          sleep 35
          t 60 xcrun simctl io "$DEVICE" screenshot ../screenshot-emergency.png
          kill $LOGPID || true
          echo "---- app log (emergency) ----"; grep -E "Emergency|Wake response|Speaking|voice|Listening|Microphone|Audio" ../app-log-emergency.txt | tail -40 || true
          if t 60 xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE"; then echo "APP ALIVE AFTER EMERGENCY WAKE ✅"; else echo "APP DIED AFTER EMERGENCY WAKE ❌"; exit 1; fi
          if grep -q "Emergency button hit-test: button=true passthrough=true" ../app-log-emergency.txt; then echo "BUTTON TAKES TOUCHES, REST PASSES THROUGH ✅"; else echo "EMERGENCY BUTTON HIT-TEST FAILED ❌"; grep "hit-test" ../app-log-emergency.txt || true; exit 1; fi
          RESPONSES=$(grep -c "Wake response (button)" ../app-log-emergency.txt || true)
          if [ "$RESPONSES" -ge 2 ]; then echo "EMERGENCY WAKE ANSWERED TWICE ✅"; else echo "EMERGENCY WAKE ANSWERED $RESPONSES TIME(S) ❌"; exit 1; fi
          DATA=$(t 60 xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)
          if [ -s "$DATA/Documents/Jarvis/Logs/last-crash.txt" ]; then echo "CRASH LOG:"; cat "$DATA/Documents/Jarvis/Logs/last-crash.txt"; exit 1; fi
          CRASHES=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i jarvis || true)
          if [ -n "$CRASHES" ]; then echo "CRASH REPORTS:"; for f in $CRASHES; do head -120 ~/Library/Logs/DiagnosticReports/$f; done; exit 1; fi
      - name: Upload build log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-and-screens
          path: |
            Jarvis.swiftpm/build.log
            screenshot-launch.png
            screenshot-3d.png
            screenshot-begin.png
            screenshot-music.png
            screenshot-emergency.png
            app-log.txt
            app-log-begin.txt
            app-log-music.txt
            app-log-emergency.txt
